name: welkui_flutter
description: "Comic-inspired Flutter widgets for Android and iOS, with crisp outlines, hard shadows, bundled typography, and accessible mobile interactions."
version: 0.1.1
repository: https://github.com/welkdock/welkUI-flutter

platforms:
  android:
  ios:

environment:
  sdk: ^3.13.4
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  qr: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/fallbacks/
    - assets/portraits/
    - assets/stickers/
  fonts:
    - family: ShortStack
      fonts:
        - asset: assets/font/short_stack/ShortStack-Regular.ttf
